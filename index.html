<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>مملكة النور — محاكاة الحكم</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: #101827; color: #fff; font-family: Arial, sans-serif; }
    main { max-width: 560px; margin: auto; }
    h1 { color: #ffd166; text-align: center; margin: 8px 0; }
    #month { text-align: center; font-size: 18px; margin: 12px; }
    .panel { background: #1f2937; border-radius: 12px; padding: 16px; margin: 14px 0; line-height: 1.9; }
    #admin { color: #a7f3d0; text-align: center; line-height: 1.8; }
    h3 { text-align: center; margin-bottom: 10px; }
    button { width: 100%; border: 0; border-radius: 9px; padding: 14px 10px; margin: 5px 0; color: white; background: #334155; font-size: 16px; cursor: pointer; }
    button:active { background: #475569; }
    button:disabled { opacity: .5; cursor: default; }
    #log { color: #fde68a; white-space: pre-line; }
    #restart { background: #047857; font-weight: bold; }
  </style>
</head>
<body>
<main>
  <h1>👑 مملكة النور</h1>
  <div id="month"></div>
  <div class="panel" id="stats"></div>
  <div id="admin">الهيكل الإداري: الملك ← مجلس المملكة ← الوزراء (الخزانة، الزراعة، الدفاع) ← حكّام الأقاليم</div>
  <h3>اختر قرارًا لهذا الشهر:</h3>
  <button data-action="farm">🌾 بناء مزرعة — 100 ذهب</button>
  <button data-action="market">🏪 بناء سوق — 120 ذهب</button>
  <button data-action="train">🛡️ تدريب الحرس — 50 ذهب</button>
  <button data-action="festival">🎉 إقامة مهرجان — 40 ذهب</button>
  <button data-action="tower">✨ إنشاء برج النور — 30 بلورة</button>
  <button data-action="trade">🚚 إرسال قافلة تجارية — 25 غذاء</button>
  <div class="panel" id="log">ابدأ حكمك، واختر قرارك الأول.</div>
  <button id="restart">بدء لعبة جديدة</button>
</main>
<script>
  let state;
  function resetGame() {
    state = { month: 1, gold: 500, crystals: 100, food: 300, happiness: 70, security: 50, farms: 0, markets: 0, gameOver: false };
    document.querySelectorAll('[data-action]').forEach(button => button.disabled = false);
    document.getElementById('log').textContent = 'بدأ حكم جديد! اختر قرارك الأول.';
    refresh();
  }
  function refresh() {
    document.getElementById('month').textContent = `الشهر: ${Math.min(state.month, 12)} من 12`;
    document.getElementById('stats').innerHTML = `💰 الذهب: ${state.gold}　 ✨ بلورات النور: ${state.crystals}<br>🌾 الغذاء: ${state.food}　 😊 رضا الشعب: ${state.happiness}/100<br>🛡️ أمن المملكة: ${state.security}/100<br>المزارع: ${state.farms}　 الأسواق: ${state.markets}`;
  }
  function notEnough(resource) {
    document.getElementById('log').textContent = `⚠️ لا تملك ما يكفي من ${resource}. اختر قرارًا آخر.`;
  }
  function doAction(action) {
    if (state.gameOver) return;
    let message = '';
    switch (action) {
      case 'farm':
        if (state.gold < 100) return notEnough('ذهب');
        state.gold -= 100; state.farms++;
        message = 'بنيت مزرعة جديدة. ستزيد إمدادات الغذاء كل شهر.'; break;
      case 'market':
        if (state.gold < 120) return notEnough('ذهب');
        state.gold -= 120; state.markets++;
        message = 'افتتحت سوقًا جديدًا. سيزيد دخل المملكة الشهري.'; break;
      case 'train':
        if (state.gold < 50) return notEnough('ذهب');
        state.gold -= 50; state.security = Math.min(100, state.security + 15);
        message = 'تدرّب الحرس وتحسّن أمن المملكة.'; break;
      case 'festival':
        if (state.gold < 40) return notEnough('ذهب');
        state.gold -= 40; state.happiness = Math.min(100, state.happiness + 15);
        message = 'أقمت مهرجانًا للشعب، فارتفع رضاه عن الحكم.'; break;
      case 'tower':
        if (state.crystals < 30) return notEnough('بلورات النور');
        state.crystals -= 30; state.security = Math.min(100, state.security + 12);
        message = 'أضاء برج النور حدود المملكة وعزّز حمايتها.'; break;
      case 'trade':
        if (state.food < 25) return notEnough('غذاء');
        state.food -= 25;
        const earned = Math.floor(Math.random() * 61) + 60;
        state.gold += earned; message = `عادت القافلة بسلام ومعها ${earned} ذهب.`; break;
    }
    document.getElementById('log').textContent = message;
    advanceMonth();
  }
  function advanceMonth() {
    state.gold += 45 + state.markets * 20 - 25;
    state.food += 30 + state.farms * 20 - 35;
    if (state.food > 0) state.happiness = Math.min(100, state.happiness + 1);
    else { state.happiness = Math.max(0, state.happiness - 12); state.food = 0; }
    state.month++;
    const event = ['quiet', 'monster', 'blessing', 'harvest'][Math.floor(Math.random() * 4)];
    let eventMessage = '';
    if (event === 'monster') {
      const damage = Math.floor(Math.random() * 8) + 5;
      state.security = Math.max(0, state.security - damage);
      eventMessage = `⚠️ هاجمت وحوش الظلام الحدود! خسرت المملكة ${damage} من الأمن.`;
    } else if (event === 'blessing') {
      state.crystals += 15; eventMessage = '✨ نعمة من النور! حصلت المملكة على 15 بلورة.';
    } else if (event === 'harvest') {
      state.food += 35; eventMessage = '🌟 موسم حصاد وفير أضاف 35 غذاء إلى المخازن.';
    }
    if (eventMessage) document.getElementById('log').textContent += '\n' + eventMessage;
    if (state.happiness <= 0) endGame('انتهى الحكم بعد غضب الشعب.');
    else if (state.security <= 0) endGame('سقطت المملكة بعدما انهارت دفاعاتها.');
    else if (state.month > 12) endGame('🏆 نجحت في حكم مملكة النور لمدة عام كامل!');
    refresh();
  }
  function endGame(message) {
    state.gameOver = true;
    document.getElementById('log').textContent = message;
    document.querySelectorAll('[data-action]').forEach(button => button.disabled = true);
  }
  document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => doAction(button.dataset.action)));
  document.getElementById('restart').addEventListener('click', resetGame);
  resetGame();
</script>
</body>
</html>
